# Production deployment to Vercel. MANUAL ONLY: it runs when you click "Run workflow"
# (Actions tab -> "Deploy production" -> Run workflow, with "Use workflow from: main").
# Nothing deploys on push or merge, and Vercel's own Git integration is not used.
#
# One-time setup:
#   GitHub repo -> Settings -> Environments -> New environment "production":
#     - Deployment branches: "Selected branches" -> main   (optionally: Required reviewers)
#     - Environment secrets:   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#     - Environment variable:  NEXT_PUBLIC_SITE_URL = your PRODUCTION domain, as https://<domain>
#         * First deploy, no custom domain yet: the free Vercel domain, e.g. https://my-portfolio.vercel.app
#           (Vercel dashboard -> your project -> Settings -> Domains -> the domain listed there)
#         * Later, with a custom domain: add it in Vercel (Settings -> Domains), then change this variable
#           to https://your-domain.com and run the workflow again. Nothing else changes.
#       It is a public value (baked into the site's HTML), so it is a variable, not a secret.
#
# Why NEXT_PUBLIC_SITE_URL is set explicitly: this pipeline builds on the GitHub runner (`vercel build`) and
# uploads the result (`--prebuilt`). Vercel's system variables (VERCEL_URL, VERCEL_PROJECT_PRODUCTION_URL, ...)
# are not reliably available to a build that does not run on Vercel, so the build must not depend on them.
#
# Flow: guard (main only) -> CI (same checks as ci.yml) -> validate config -> vercel pull -> vercel build --prod
#       -> verify build output -> vercel deploy --prebuilt --prod -> smoke test of the live site.
name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one that is already uploading.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Pinned Vercel CLI (exact version, never "latest": this tool receives the deploy token).
  # To upgrade: read the CLI release notes, change this one value, then run the workflow.
  VERCEL_CLI_VERSION: 63.1.2

defaults:
  run:
    shell: bash # fail fast: bash -e -o pipefail

jobs:
  guard:
    name: Only deploy from main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require refs/heads/main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Wrong branch::Production deploys run from main only. This run is on '$REF'. Re-run the workflow with 'Use workflow from: main'."
            exit 1
          fi

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Build and deploy to Vercel
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production # branch restriction, approvals and the Vercel secrets live on this environment
      url: ${{ steps.deploy.outputs.site_url }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Verify required configuration
        # Fails before anything is installed or built. Only names are printed, never values.
        # NEXT_PUBLIC_SITE_URL may be the free https://<project>.vercel.app domain or a custom https domain.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          failed=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::Environment secret $name is not set on the 'production' environment."
              failed=1
            fi
          done

          url="$NEXT_PUBLIC_SITE_URL"
          if [ -z "$url" ]; then
            echo "::error title=Missing variable::Environment variable NEXT_PUBLIC_SITE_URL is not set on the 'production' environment. Use your production domain, e.g. https://my-portfolio.vercel.app (Vercel project -> Settings -> Domains)."
            failed=1
          else
            lower="$(printf '%s' "$url" | tr '[:upper:]' '[:lower:]')"
            host="${lower#https://}"
            host="${host%/}"
            if [ "${lower#https://}" = "$lower" ]; then
              echo "::error title=Insecure NEXT_PUBLIC_SITE_URL::It must start with https:// (a production site must not use http://)."
              failed=1
            elif printf '%s' "$host" | grep -Eq '(^|\.)(localhost|local|internal|test|invalid|lan|home|corp|intranet)(:[0-9]+)?$|^(127\.|0\.0\.0\.0|10\.|192\.168\.|\[)'; then
              echo "::error title=Non-public NEXT_PUBLIC_SITE_URL::'$host' is a local or reserved name, not a public production domain."
              failed=1
            elif ! printf '%s' "$host" | grep -Eq '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'; then
              echo "::error title=Malformed NEXT_PUBLIC_SITE_URL::Expected a bare https domain such as https://my-portfolio.vercel.app: a real domain name, with no path, port, credentials or spaces."
              failed=1
            elif printf '%s' "$host" | grep -Eq '^(www\.)?(example\.(com|org|net)|your-domain\.com)$'; then
              echo "::error title=Placeholder NEXT_PUBLIC_SITE_URL::'$host' is a placeholder from the examples. Use your real production domain."
              failed=1
            elif [[ "$host" == *.vercel.app ]]; then
              echo "::notice title=Production URL::Using the free Vercel domain $host"
            else
              echo "::notice title=Production URL::Using the custom domain $host. It must be added to the Vercel project (Settings -> Domains) before this deploy."
            fi
          fi

          [ "$failed" -eq 0 ] || exit 1
          echo "Required configuration is present."

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Vercel CLI (pinned)
        run: npm install --global --ignore-scripts --no-audit --no-fund "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel project settings
        # The only step before the deploy that receives the token. Writes .vercel/ (gitignored).
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production

      - name: Build (vercel build --prod)
        # Every build-time variable the site needs is passed explicitly here: NEXT_PUBLIC_SITE_URL is the only one.
        # No Vercel token: the build runs project and dependency code, and the CLI does not need credentials to build.
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: vercel build --prod

      - name: Verify build output
        # The canonical URL baked into the build must equal NEXT_PUBLIC_SITE_URL. This catches a missing or
        # overridden variable that would otherwise deploy "successfully" with a localhost or wrong-domain canonical.
        # It also records the Next.js build ID, which the smoke test looks for in the live site.
        id: build_output
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          expected="$(printf '%s' "${NEXT_PUBLIC_SITE_URL%/}" | tr '[:upper:]' '[:lower:]')"
          found="$(grep -rhoE '<link rel="canonical" href="[^"]*"' .vercel/output | sed -E 's/.*href="([^"]*)"/\1/' | sort -u || true)"
          if [ "$found" != "$expected" ]; then
            echo "::error title=Canonical URL mismatch::Build output has canonical '${found:-<none>}' but NEXT_PUBLIC_SITE_URL is '$expected'. Not deploying."
            exit 1
          fi
          echo "Canonical URL in build output: $found"

          build_id="$(cat .next/BUILD_ID 2>/dev/null || true)"
          case "$build_id" in
            '' | *[!A-Za-z0-9_-]*)
              echo "::error title=Build ID unavailable::Could not read a valid Next.js build ID from .next/BUILD_ID. Not deploying."
              exit 1
              ;;
          esac
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: Deploy (vercel deploy --prebuilt --prod)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          BUILD_ID: ${{ steps.build_output.outputs.build_id }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod)" # stdout is only the deployment URL; logs go to stderr
          case "$deployment_url" in
            https://*) ;;
            *) echo "::error title=Deploy failed::Vercel CLI did not return a deployment URL."; exit 1 ;;
          esac
          echo "site_url=${NEXT_PUBLIC_SITE_URL%/}" >> "$GITHUB_OUTPUT"
          {
            echo "### Production deployment"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Build ID: \`${BUILD_ID}\`"
            echo "- Deployment: ${deployment_url}"
            echo "- Site: ${NEXT_PUBLIC_SITE_URL%/}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test production site
        # Checks the real site at NEXT_PUBLIC_SITE_URL, not just "is something answering": the page must contain
        # the build ID of the build we just deployed, plus the security header and the canonical URL.
        # The deployment is already live at this point. A failure means: look at the site, roll back if needed.
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          BUILD_ID: ${{ steps.build_output.outputs.build_id }}
        run: |
          site="${NEXT_PUBLIC_SITE_URL%/}"
          expected="$(printf '%s' "$site" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$BUILD_ID" ]; then
            echo "::error title=Smoke test cannot run::No build ID was recorded by the build step."
            exit 1
          fi
          body="$(mktemp)"
          reason="no response yet"
          for attempt in 1 2 3 4 5 6 7 8; do
            result="$(curl -sS -L --max-redirs 3 --proto-redir '=https' --max-time 15 -o "$body" \
              -w '%{http_code}\t%header{content-security-policy}' "$site/" 2>/dev/null || true)"
            status="${result%%$'\t'*}"
            csp="${result#*$'\t'}"
            case "$status" in
              200)
                if grep -qF -- "$BUILD_ID" "$body"; then
                  canonical="$(grep -oE '<link rel="canonical" href="[^"]*"' "$body" | sed -E 's/.*href="([^"]*)"/\1/' | head -n 1)"
                  problems=""
                  [ -n "$csp" ] || problems="$problems [no Content-Security-Policy header]"
                  [ "$canonical" = "$expected" ] || problems="$problems [canonical is '${canonical:-none}', expected '$expected']"
                  if [ -z "$problems" ]; then
                    echo "OK: $site serves build $BUILD_ID with a CSP header and the correct canonical URL (attempt $attempt)."
                    exit 0
                  fi
                  reason="serving this build, but:$problems"
                else
                  reason="HTTP 200, but it is NOT the build we just deployed (an older deployment is still live, or this domain belongs to a different Vercel project)"
                fi
                ;;
              401 | 403)
                echo "::error title=Site is protected::$site returned HTTP $status, so the deployment cannot be verified. The production domain is behind Vercel Deployment Protection (Settings -> Deployment Protection). A public portfolio normally uses 'Standard Protection', which leaves production domains open."
                exit 1
                ;;
              000 | '')
                reason="could not connect to $site (DNS not ready, or the URL is wrong)"
                ;;
              404)
                reason="HTTP 404 (this domain is probably not assigned to the Vercel project: check Settings -> Domains)"
                ;;
              *)
                reason="HTTP $status"
                ;;
            esac
            echo "Attempt $attempt of 8: $reason. Retrying in 10s..."
            sleep 10
          done
          echo "::error title=Smoke test failed::$site: $reason. The deployment itself is live: inspect it in the Vercel dashboard and roll back (Deployments -> previous production deployment -> Promote to Production) if needed."
          exit 1
